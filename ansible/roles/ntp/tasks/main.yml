---
- name: Disable and mask systemd-timesyncd
  ansible.builtin.systemd:
    name: systemd-timesyncd
    state: stopped
    enabled: false
    masked: true
  ignore_errors: true

- name: Install Chrony
  ansible.builtin.apt:
    name: chrony
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Deploy Master Chrony Configuration
  ansible.builtin.template:
    src: chrony-master.conf.j2
    dest: /etc/chrony/chrony.conf
    owner: root
    group: root
    mode: '0644'
  when: inventory_hostname in groups['master_nodes']
  notify: Restart Chrony

- name: Deploy Client Chrony Configuration
  ansible.builtin.template:
    src: chrony-client.conf.j2
    dest: /etc/chrony/chrony.conf
    owner: root
    group: root
    mode: '0644'
  when: inventory_hostname in groups['worker_nodes']
  notify: Restart Chrony

- name: Ensure Chrony is enabled and running
  ansible.builtin.systemd:
    name: chrony
    state: started
    enabled: true